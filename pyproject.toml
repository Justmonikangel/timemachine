[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-calendar-agent"
version = "0.1.0"
description = "A local-first, safety-oriented adaptive calendar agent with ADHD-friendly scheduling rules."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jolyne Pan"}]
dependencies = [
  "dateparser>=1.2,<2",
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.2,<2"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1"
]

[project.scripts]
aca = "adaptive_calendar_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
